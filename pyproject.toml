[project]
name = "desk"
version = "0.1.0"
description = "Solana Quant Desk (KESTREL): local memecoin research, paper trading and risk-controlled execution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - owned by the operator" }
# Runtime dependencies are kept deliberately small (PLAN.md D-15). Everything else is standard library.
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "solders==0.29.0",
    "numpy==2.3.4",
]

[project.scripts]
desk = "desk.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "hypothesis==6.168.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: opt-in read-only tests that call real provider APIs (run with: pytest -m live)",
    "slow: tests that take more than a few seconds",
]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", "RUF002", "RUF003",  # we intentionally use typographic characters in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["desk"]
plugins = ["pydantic.mypy"]
