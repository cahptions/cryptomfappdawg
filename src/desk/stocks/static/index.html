<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KESTREL Stocks · PAPER</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/stocks.css" />
    <link rel="stylesheet" href="/assets/research.css" />
    <link rel="stylesheet" href="/assets/paper.css" />
    <script src="/assets/research.js" defer></script>
    <script src="/assets/calculator.js" defer></script>
    <script src="/assets/explore.js" defer></script>
    <script src="/assets/evidence.js" defer></script>
    <script src="/assets/paper.js" defer></script>
    <script src="/assets/learning.js" defer></script>
    <script src="/assets/stocks.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="#dashboard"
        ><img src="/assets/mark.svg" width="24" height="24" alt="" /> KESTREL
        <span>Research</span></a
      >
      <nav aria-label="Main">
        <a href="#dashboard">Home</a><a href="#stocks">Stocks</a
        ><a href="#options">Options</a> <a href="#paper">Paper</a
        ><a href="#learning">Learning</a><a href="#proof">Evidence</a
        ><a href="#system">System</a><a href="#settings">Settings</a>
      </nav>
      <form id="stock-search" role="search">
        <input
          id="quick-symbol"
          aria-label="Search stocks"
          placeholder="Search a stock…"
          maxlength="12"
          list="stock-symbols"
          autocomplete="off"
        /><button aria-label="Open stock">
          <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 12 12 4M4 4h8v8" />
          </svg>
        </button>
      </form>
      <strong class="badge">PAPER</strong>
    </header>
    <div id="status" role="status">Loading local records…</div>
    <datalist id="stock-symbols"></datalist>
    <main id="app"></main>
    <footer>
      Research and simulated orders only. No brokerage trades can be placed from
      this desk. Scores are not probabilities.
    </footer>
  </body>
</html>
