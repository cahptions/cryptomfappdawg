# ─────────────────────────────────────────────────────────────────────────────
# KESTREL desk — default configuration.
# This file is the ONE authoritative definition of every tunable value.
# Every decision records a hash of the loaded configuration ("config snapshot").
# Values must stay within config/safety_ceilings.toml or the desk refuses to start.
# ─────────────────────────────────────────────────────────────────────────────

[desk]
mode = "SHADOW"          # SHADOW (default) | PAPER | LIVE. LIVE also needs the gates in PLAN.md §16.5 (M8).

[paper]
starting_capital_usd = "500"   # operator update 2026-10-20: reference account, sizing base and replica capital
# Learning cash is a separate simulated cushion, not the reference account.
learning_cash_usd = "100000"
max_learning_positions = 10                  # bounded by the free Jupiter quote budget (~2 exit quotes/min each)
learning_max_cumulative_loss_usd = "1000"    # absolute learning-book halt, separate from account-relative limits
mark_interval_seconds = 25                   # executable exit quote per open position (PLAN §12.1: 20-30 s)
guardian_loop_seconds = 5                    # exit policies evaluated every loop (PLAN §13.3)
guardian_heartbeat_max_age_seconds = 20      # entries are impossible while the guardian is not supervising
conservative_wait_seconds = 2.5              # PLAN §12.2: real wait, then a second quote; the worse is used
simulated_failure_rate = "0.10"              # conservative profile
stress_failure_rate = "0.25"                 # stress profile
signature_fee_lamports = 5000                # per transaction
priority_fee_lamports = 100000               # conservative model until R-06 measures it (0.0001 SOL)
token_account_rent_lamports = 2039280        # SPL token account; locked while open, refunded on close
fee_probe_taker = "5tzFkiKscXHK5ZXCGbXZxdw7gTjjD1mBwuoFbhUvuAi9"  # public funded address; read-only fee probes
fee_probe_interval_seconds = 600             # real Jupiter orders for that taker report actual network fees

[sizing]                        # $500 small-account profile
fixed_fraction = "0.10"                      # ~$50 initial tickets; existing percentage caps still apply
max_ticket_fraction_free_capital = "0.15"
max_ticket_fraction_pool_liquidity = "0.005"
max_ticket_fraction_equity = "0.15"          # hard cap relative to eligible account capital
min_ticket_sol = "0.05"
max_fixed_cost_fraction = "0.01"             # fee floor: signature + priority fees ≤ 1% of ticket

[limits]
max_open_positions = 2
max_total_exposure_fraction = "0.25"
max_positions_per_dev = 1
max_positions_per_launchpad = 1
daily_realized_loss_fraction = "0.05"
daily_equity_drawdown_fraction = "0.08"
cumulative_drawdown_fraction = "0.25"
max_trades_per_day = 10
max_order_submissions_per_min = 6
max_consecutive_failed_tx = 3
stale_data_halt_seconds = 120
live_sol_reserve = "0.05"

[http]
timeout_seconds = 10
max_retries = 3
backoff_base_seconds = 2
backoff_max_seconds = 60
user_agent = "desk/0.1 (private local research tool)"

[health]
degraded_after_failures = 3
down_after_failures = 10
recover_after_successes = 3

[collector]
geckoterminal_new_pools_interval_seconds = 60
geckoterminal_new_pools_pages = 2
geckoterminal_trending_interval_seconds = 120
jupiter_recent_interval_seconds = 60
jupiter_trending_interval_seconds = 180
dexscreener_refresh_interval_seconds = 60
dexscreener_promotions_interval_seconds = 300
rpc_slot_interval_seconds = 60
max_tracked_tokens = 300

[storage]
raw_retention_days = 14

[discovery]                     # M2: bounded, read-only evaluation; no trades
evaluation_interval_seconds = 30
max_assessments_per_cycle = 2
reassess_after_seconds = 300
min_pool_age_seconds = 900
min_liquidity_usd = "40000"
min_volume_h1_usd = "20000"
min_fdv_usd = "100000"
max_fdv_usd = "50000000"
max_snapshot_age_seconds = 120
min_distinct_traders_h1 = 100
ticket_sol = "0.10"
max_quote_age_seconds = 10
max_roundtrip_cost_fraction = "0.03"
max_top1_pct = "10"
max_top10_pct = "35"
max_dev_pct = "5"
max_holder_conflict_pp = "10"
max_source_conflict_fraction = "0.30"
extreme_dev_mints = 500
min_dev_migration_fraction = "0.01"
volume_expansion_ratio = "2"
acceleration_ratio = "1.5"
renewed_after_seconds = 21600

[context]                       # M3: measured market context for regime labels; read-only
sol_reference_pool = "Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE"  # Orca SOL/USDC, verified 2026-10-19 (m3_* evidence)
interval_seconds = 60
hazard_followup_interval_seconds = 300

[research]                      # M6: local statistical models are logged and benchmarked only
model_influence = "none"        # the only accepted value until a model is validated and the operator approves
council = "record"              # two research advisors record what they would say; they never change a trade

[live]                          # M8: real-money infrastructure. Nothing here can arm LIVE (PLAN §16.5 gates)
max_capital_sol = "0"           # 0 = LIVE impossible. You set this yourself when you decide; ceiling 2 SOL
max_priority_fee_lamports = 1000000   # the signer refuses transactions paying more (0.001 SOL)
intent_max_age_seconds = 30
entry_slippage_bps = 100        # a BUY's guaranteed minimum is 1% below its fresh quote
exit_slippage_bps = 300         # a SELL accepts up to 3% below its fresh quote: exiting matters more than price
withdraw_address = ""           # your own cold wallet; empty = withdrawals impossible (typed confirmation each time)
allowed_fee_destinations = []

[robinhood]                     # the Robinhood desk (docs/ROBINHOOD.md); PAPER only, no order code exists
starting_capital_usd = "500"
learning_cash_usd = "100000"
fixed_fraction = "0.10"
max_ticket_fraction = "0.15"
max_open_positions = 10
learning_max_cumulative_loss_usd = "1000"
max_roundtrip_cost_fraction = "0.02"
estimate_max_age_seconds = 10
quote_interval_seconds = 60
learning = "paper"          # learning lab: "paper" (a procedure that passes unseen months may PAPER trade), "record", "off"
backtest_roundtrip_cost_fraction = "0.02"   # the universe rules live in the frozen strategy spec (desk/rh/strategies.py)
dashboard_port = 8766

[stocks]                        # KESTREL Stocks (docs/STOCKS.md): research + PAPER stocks and options; no order code exists
dashboard_port = 8767
tradier_env = "sandbox"         # "sandbox" (free developer token, 15-min delayed) or "production" (Tradier Brokerage token)
options_provider = "tradier"    # "schwab": market data after desk stocks connect; never brokerage orders
schwab_callback_url = "https://127.0.0.1:8182/oauth/callback" # must exactly match the approved Schwab app
history_days = 730              # Massive's free plan keeps 2 years of end-of-day bars
min_price_usd = "1"
min_median_dollar_volume_usd = "1000000"
options_focus_symbols = 150     # ranked focus for bounded option batches; this is not a daily coverage guarantee
refresh_after_close_minutes = 75
paper_starting_capital_usd = "10000"
paper_option_capital_usd = "50000"
paper_max_position_fraction = "0.20" # stock tickets; benchmark holds stay fully invested
paper_stock_risk_fraction = "0.02"  # planned stop risk per ticket; gaps can lose more
paper_stock_participation_fraction = "0.005" # at most 0.5% of observed daily dollar volume
paper_max_option_premium_fraction = "0.02"
paper_max_options_at_risk_fraction = "0.10"
paper_max_open_positions = 30
learning = "paper"              # "paper": strategies that pass on unseen periods may PAPER trade; "record"; "off"
